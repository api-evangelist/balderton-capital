aid: balderton-capital
name: Balderton Capital
description: >-
  Balderton Capital is a London-headquartered venture capital firm focused
  exclusively on backing European-founded technology companies. Founded in 2000
  as Benchmark Capital Europe and fully independent since 2007, Balderton is one
  of Europe's largest and most established venture firms, with over $7 billion in
  assets under management across dedicated early-stage and growth funds. The firm
  invests from Seed through Series B and follows on into growth stages, writing
  checks across sectors including fintech, artificial intelligence, B2B SaaS,
  developer tools and infrastructure, digital health, gaming, marketplaces and
  climate. Balderton is known for a founder-centric model, running a dedicated
  founder wellbeing and performance platform and an executive/talent network to
  support portfolio companies. Notable investments over the firm's history include
  Revolut, GoCardless, Depop, Darktrace, Contentful, Dream Games, Wayve, Aircall,
  Citymapper, Talend, MySQL, Recorded Future, Sophia Genetics and The Hut Group
  (THG).
